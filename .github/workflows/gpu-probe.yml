name: Graphics driver diagnosis
on:
  push:
    branches: [main]
    paths: ['scripts/gpu-probe.mjs', '.github/workflows/gpu-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y mesa-vulkan-drivers xvfb
      - run: xvfb-run -a node scripts/gpu-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graphics-diagnosis
          path: reports/
          retention-days: 7
