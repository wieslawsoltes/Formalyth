name: Validate and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.js
      - name: Package exact committed source
        if: always()
        run: git archive --format=zip HEAD -o /tmp/Formalyth-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Formalyth-source
          path: /tmp/Formalyth-source.zip
          retention-days: 7
